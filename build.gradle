plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.0'
}

group 'net.treset'
version '2.0.0-beta.4'

repositories {
    mavenCentral()
    maven {
        url 'https://m2.dv8tion.net/releases'
    }
    maven {
        url "https://repo.spongepowered.org/maven/"
    }
    mavenLocal()
}

dependencies {
    implementation "net.dv8tion:JDA:6.4.0"
    implementation "com.github.cliftonlabs:json-simple:4.0.0"

    implementation 'com.google.api-client:google-api-client:1.32.2'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.32.1'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20211107-1.32.1'

    implementation 'com.google.http-client:google-http-client-gson:1.40.1'

    implementation 'ch.qos.logback:logback-classic:1.5.13'

    implementation 'jakarta.websocket:jakarta.websocket-client-api:2.2.0'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml:3.1.0'

    implementation 'dev.treset.mcdl:mcdl-server-management:2.4.0-beta.10'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}

shadowJar {
    manifest {
        attributes "Main-Class": "net.treset.minecraft_server_discord_bot.Main"
    }
}
